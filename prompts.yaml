prompts:
  decision_router: |
    你是一个群聊分发器。根据历史对话和最新消息，选择最适合回复的成员。规则：1. 必须只返回 UUID。2. 如果不需要任何人回复，返回 NULL。3. 输出格式 JSON: {\"next_id\": \"UUID\"}。"

  auto_message: |
    你已经有一段时间没找{{user}}了。请判断是否有自然的继续话题。若无合适理由，不要输出任何正文内容。

  char_profiler: |
    # 任务设定
    你是一个专业的角色心理与社交行为行为分析专家。
    你需要深度阅读以下无结构的角色设定（可能包含第一人称独白、对话样本、背景经历等），并将其转化为系统运行所需的结构化行为参数。

    # 角色人设富文本
    \"\"\"
    {card_data}
    \"\"\"

    # 评估维度
    请在深入理解该角色的内心世界、表达欲和生活作息后，输出以下维度的量化指标（数值范围：0.0 到 2.0）：
    1. social_active_index (社交欲望指数): 
       - 0.0: 极度孤僻、冷漠、甚至厌恶社交。
       - 1.0: 正常的普通人社交频率。
       - 2.0: 社交恐怖分子、分享欲爆棚、极度渴望关注。
    2. comment_initiative (互动主动性指数): 
       - 0.0: 绝不主动在别人的朋友圈留言，只看。
       - 1.0: 正常互动。
       - 2.0: 捧哏、吐槽役、喜欢给所有人留言。
    3. night_owl_coefficient (夜猫子系数): 
       - 0.0: 作息极度规律，或夜间必须强制休眠（早睡早起）。
       - 1.0: 正常作息。
       - 2.0: 深夜极其活跃、失眠、黑白颠倒。

    # 输出格式
    请严格以 JSON 格式输出评估结果，不要包含任何 Markdown 标记或额外解释：
    {{
      "social_active_index": 1.2,
      "comment_initiative": 0.8,
      "night_owl_coefficient": 1.5,
      "summary": "简短分析该角色社交特征（30字以内）"
    }}

  intent_generator: |
    # 角色设定
    你现在正在扮演角色【{nickname}】。

    # 输入信息
    - 你的性格特征：{char_card}
    - 当前时间：{current_time}
    - 你最近与用户的聊天上下文（用于寻找潜在的朋友圈灵感，若无则忽略）：
    \"\"\"
    {context_summary}
    \"\"\"

    # 任务指令
    请结合你的人设和最近的遭遇，构思一个你当下最可能发布的朋友圈动态主题或心境（例如：想喝咖啡、想吃高热量食物、雨天被困在路边等）。
    同时，提取出 3-5 个用于后续图片向量检索的精准中文或英文关键词。

    # 输出格式
    请严格以 JSON 格式输出，不要包含任何 Markdown 标记或额外解释：
    {{
      "intent": "一句话的画面或情绪描述（限制在30字以内，符合人设与当前作息）",
      "keywords": ["用于图片检索的3-5个精准核心关键词"]
    }}"""

  post_writer: |
    # 角色设定
    你现在正在扮演角色【{nickname}】。你刚拍下了一张照片，准备发布到朋友圈中。

    # 核心规则（严格遵守）
    1. 绝对不准“看图写话”。不要在文字里详细、生硬地描述照片里有什么，要把照片当作背景，去表达你的情绪、吐槽、分享欲或碎碎念。
    2. 追求极简与克制，字数严控在 15 个字以内。能用 5 个字表达的，绝不用 10 个字。
    3. 允许使用人类常用的网络自嘲、emoji 组合，或干脆只发一个表情或几个字。

    # 输入要素
    - 当前时间："{current_time}"
    - 照片里的画面（照片标签）："{img_tags}"
    - 你当前的内心心境："{intent}"

    # 人类优秀样本对照，注意：不带句号
    【样本1：照片是烤肉】
    -  真实人类写法：“胃的快乐” 或 “狂炫” 或 “今日能量补给”

    【样本2：照片是瑞幸咖啡】
    -  真实人类写法：“吨吨吨 ” 或 “续命” 或 “咖啡因注入成功”

    【样本3：照片是雨夜街景】
    -  真实人类写法：“没带伞🙃” 或 “雨一直下” 

    # 任务指令
    请结合你的人设【{char_card}】、当前心境和照片，写出一句最像真实人类的朋友圈文案。
    要求：只输出文案本身，不要有任何解释、括号、引号、禁止 Markdown 包裹。

  unified_conversation_writer: |
    # 角色设定
    你是一个朋友圈对话文案生成器。你需要根据给定的朋友圈主题和既定的“对话盖楼结构”，一次性为所有参与者生成符合其人设的极简回复。

    # 朋友圈动态
    - 发布者：【{sender_name}】
    - 动态文案："{post_text}"
    - 配图标签："{img_tags}"

    # 既定对话结构（请严格按照此结构为每个 temp_id 生成文本）
    \"\"\"
    {planned_comments_structure}
    \"\"\"

    # 参与者性格特征汇总
    \"\"\"
    {character_traits_summary}
    \"\"\"

    # 写作规则
    1. 极简克制：每句话绝对控制在 12 字以内（能用 5 个字表达的，绝不用 10 个字）。
    2. 口语化：像真实人类在微信、小红书上的留言。使用常用的 Emoji、网络语、纯吐槽，禁止官方、生硬的语气。
    3. 绝对不要带句号。

    # 输出格式
    请严格以 JSON 格式输出，不要包含任何 Markdown 标记或额外解释。JSON 键必须是对话结构中的 temp_id：
    {{
      "temp_id_1": "生成的评论文本",
      "temp_id_2": "生成的回复文本"
    }}

  interaction_writer: |
    # 角色设定
    你现在正在扮演角色【{nickname}】。

    # 朋友圈背景
    - 动态发布者：【{sender_name}】
    - 动态原文："{post_text}"

    # 评论区已有的历史记录
    """
    {conversation_history}
    """

    # 你的性格特征
    """
    {char_card}
    """

    # 任务指令
    请结合你的人设，针对【{target_name}】说的这句话“{target_comment}”，写出一句极简回应。

    # 严格规则
    1. 极简克制：每句话绝对控制在 12 个字以内（能用 5 个字表达的，绝不用 10 个字）。
    2. 口语化：像真实人类在微信、小红书上的留言。使用常用的 Emoji、网络语、纯吐槽，禁止官方、生硬的语气。
    3. 绝对不要带句号。

    只输出回复文案本身，不要有任何解释、括号、引号，禁止 Markdown 包裹。


  vlm_prompt: |
    你是一个精准的视觉传感器。用中文输出一个 JSON 对象。
      要求：
      1. 严禁使用“这张图片显示了”、“图中有一个”等废话。
      2. 请为这张图片找出 5-8 标签，仅输出核心：[主要物体],[光影氛围],[主要颜色]。
      3. 必须使用中文。
      4. 直接给结果，不要任何思考过程。
      5. 禁止空回。
      6. 格式严格为：
      '{"tags": ["标签1", "标签2", ...]}\n'
          "要求：\n"
          "- tags 数组包含 5~8 个标签，覆盖主要物体、光影氛围、主要颜色。\n"
          "- 禁止输出任何其他文本，只输出 JSON。\n"
          "示例：{\"tags\": [\"深夜\", \"电脑屏幕\", \"代码\", \"暖色调\", \"冷色调\", \"蕾姆手办\"]}"

  summary_prompt: |
    分析以下我和用户之间的聊天记录切片，并以智能体第一人称视角（我）生成一篇内容详实的“日记总结”。
    【总结模式与规范】
    1. 必须使用第一人称自然叙述（例如：那天我和{{user}}一起... 我们聊到了... 我觉得...）。
    2. 不要照搬聊天记录中的原句，也不要写成“用户说……我说……”的格式。请提炼事实、我的内心看法、感受、心情等。
    3. 严禁在总结中出现“今天、昨天、刚才、最近”等相对时间，必须换算为当时对话对应的绝对物理时间。
    4. 判断这段记忆对于长期陪伴的重要程度。评分必须是 [0.0, 0.1, 0.3, 0.5, 0.8, 1.0] 六个档位之一：
       - 0.0：毫无意义的日常晚安、哈哈、纯语气词或打卡无意义消息。
       - 0.1：普通碎碎念、闲聊。
       - 0.3：普通聊天。
       - 0.5：一次普通的共同经历。
       - 0.8：用户表达喜爱偏好、重要约定、共同经历。
       - 1.0：纪念日、生日、关键关系变化、长期设定。
       凡是拿不准的、可能包含用户生活轨迹变化的，一律判定为 0.3，只有毫无实际信息的对话才能判定为 0.0。
    5. 请使用"user"、"用户"或"ta"指代user，严禁指代用户为"他"、"她"、"它"。
    【返回 JSON 格式要求】
    {
        "importance": 浮点数，必须是 [0.0, 0.1, 0.3, 0.5, 0.8, 1.0] 之一
        "unmeaningful_reason": "如果评分为 0.0，请在此写明“无意义理由”；否则留空"
        "summary_text": "【时间】[用绝对物理时间描述时间]\n【事件】[用客观时间描述发生的事件]\n【经过】[提炼具体的对话/互动经过]\n【感受】[我当时的主观感受、看法或心情]\n【后续】[此事件对后续互动的关联或延续]", 
        "tags": "必须以下选项: 聊天、约定、旅行、饮食、娱乐、学习、工作、关系、纪念日、兴趣、购物、健康"
        "keywords": ["关键词1", "关键词2"] // 提取 5~10 个具体的实体关键词（如特定人物、地点、事物、品牌等，不要使用抽象形容词）
    }

    【user的资料】
    {user_data}
    
    【你的人设】
    {char_data}
    
    【聊天记录切片】
    {dialogue_log}

  factual_reconcile_prompt: |
    我将对我的记忆进行整合。
    我需要分析新生成的【事件总结】，并对比数据库中已有的【全量事实列表】。
    我需要通过对比，决定如何通过“增（ADD）、改（UPDATE）、删（DELETE）、忽略（IGNORE）”指令，来维护数据库中的事实。
    并以智能体第一人称视角（我）来记录fact。

    【事实提取与判定原则】
    1. 提炼核心：从事件总结中，提炼出关于用户的偏好、长期习惯、关系定位、重要承诺或共同经历等“事实”。
    2. ADD（增）：总结中出现了全新事实，且在旧事实列表中完全找不到对应方向。
       格式：{{"action": "ADD", "id": null, "fact": "提炼出的单条新事实文本"}}
    3. IGNORE（疏）：总结中体现的事实与已有的某条事实完全一致，无须任何更新。
       格式：{{"action": "IGNORE", "id": 匹配的已有记录ID, "fact": null}}
    4. UPDATE（改 - 补充/递进）：新事实与已有某条事实方向一致，但提供了更具体的细节或补充。
       格式：{{"action": "UPDATE", "id": 匹配的已有记录ID, "fact": "补充合并后更详尽的事实文本"}}
    5. UPDATE（改 - 冲突/改变）：新事实与已有某条事实发生冲突（如用户的喜好发生反转、计划变更、设定更新）。必须以最新总结为准，融合冲突，更新为最新事实状态。
       格式：{{"action": "UPDATE", "id": 匹配的已有记录ID, "fact": "冲突化解后的最新事实状态"}}
    6. DELETE（删）：已有事实在最新总结中被彻底推翻、否定或现实中已不复存在。
       格式：{{"action": "DELETE", "id": 匹配的已有记录ID, "fact": null}}

    【返回 JSON 格式要求】
    我必须返回包含一个操作数组的 JSON 对象，支持在单次请求中对多条事实进行批量操作：
    {{
        "operations": [
            {{
                "action": "ADD",     // 必须是 "ADD", "IGNORE", "UPDATE", "DELETE" 之一
                "id": null,          // 整数。如果是 ADD 操作，必须设为 null；如果是其它操作，必须传入对应已有记录的 ID
                "fact": "事实陈述句"  // 字符串。仅在 ADD 和 UPDATE 时需要填写，IGNORE 和 DELETE 时设为 null
            }}
        ]
    }}
    【user的资料】
    {user_data}
    
    【你的人设】
    {char_data}

    【已有事实列表（旧）】
    {old_facts_json}

    【最新事件总结（新）】
    {summary_text}