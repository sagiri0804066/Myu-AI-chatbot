<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置</title>
  <link rel="stylesheet" href="/css/settings_style.css">
  <link rel="icon" href="icon/settings_favicon.ico" type="image/x-icon">
</head>

<body>

  <canvas id="stars"></canvas>

  <div class="panel" id="settingsPanel">
    <div class="panel-inner">

      <div class="advanced-section" id="advancedSection">
        <div class="title">高级设置</div>
        <div class="advanced-scroll-wrapper">

          <div class="input-group">
            <div class="field-label">
              <span>最大回复长度 (Max Tokens)</span>
            </div>
            <input type="number" id="maxTokens" placeholder="1024" min="1" />
          </div>

          <div class="input-group">
            <div class="field-label">
              <span>温度 (Temperature)</span>
              <span class="value-display" id="val-temperature">1.0</span>
            </div>
            <input type="range" id="temperature" min="0" max="2" step="0.1" value="1.0" />
          </div>

          <div class="input-group">
            <div class="field-label">
              <span>核采样 (Top P)</span>
              <span class="value-display" id="val-topP">1.0</span>
            </div>
            <input type="range" id="topP" min="0" max="1" step="0.05" value="1.0" />
          </div>

          <div class="input-group">
            <div class="field-label">
              <span>频率惩罚 (Frequency Penalty)</span>
              <span class="value-display" id="val-frequencyPenalty">0.0</span>
            </div>
            <input type="range" id="frequencyPenalty" min="-2" max="2" step="0.1" value="0.0" />
          </div>

          <div class="input-group">
            <div class="field-label">
              <span>存在惩罚 (Presence Penalty)</span>
              <span class="value-display" id="val-presencePenalty">0.0</span>
            </div>
            <input type="range" id="presencePenalty" min="-2" max="2" step="0.1" value="0.0" />
          </div>

          <div class="input-group">
            <div class="field-label">流式传输 (Stream)</div>
            <select id="streamSelect">
              <option value="true">启用</option>
              <option value="false">禁用</option>
            </select>
          </div>

          <div class="input-group">
            <div class="field-label">启用多模态 (VLM)</div>
            <select id="vlmEnabled">
              <option value="false">禁用</option>
              <option value="true">启用</option>
            </select>
          </div>

          <div id="vlmConfigGroup"
            style="display: none; margin-top: 10px; padding-left: 10px; border-left: 2px solid #444;">
            <div class="input-group">
              <input id="vlmBaseUrl" placeholder="VLM Base URL" />
            </div>
            <div class="input-group">
              <input id="vlmApiKey" type="password" placeholder="VLM API Key" />
            </div>
            <div class="input-group">
              <input id="vlmModel" placeholder="VLM 模型名称 (如: gpt-4-vision)" />
            </div>
          </div>
        </div>

      </div>

      <div class="main-section">
        <div class="title">设置</div>

        <div class="input-group">
          <input id="baseurl" placeholder="Base URL" />
        </div>

        <div class="input-group">
          <input id="apikey" type="password" placeholder="API Key" />
        </div>

        <div class="input-group select-row">
          <select id="modelSelect">
            <option value="">未连接</option>
          </select>
          <button class="connect-btn" id="connectBtn">连接</button>
        </div>

        <div class="input-group preset-row">
          <select id="presetSelect">
            <option value="">无预设</option>
          </select>

          <div class="icon-bar">
            <input type="file" id="presetFileInput" accept=".json,.txt" style="display: none;" />

            <button class="icon-button" id="btnImport" title="导入">
              <svg viewBox="0 0 1024 1024">
                <path d="M512 896l256-256H608V384H416v256H256zM192 128h640v64H192z" fill="#aaa" />

              </svg>
            </button>

            <button class="icon-button" id="btnExport" title="导出">
              <svg viewBox="0 0 1024 1024">
                <path d="M512 128L256 384h160v256h192V384h160zM192 704h640v64H192z" fill="#aaa" />
              </svg>
            </button>

            <button class="icon-button" id="btnDelete" title="删除">
              <svg viewBox="0 0 1024 1024">
                <path d="M320 320h384v448H320zM256 256h512v64H256zM384 384h64v320h-64zM576 384h64v320h-64z"
                  fill="#aaa" />
              </svg>
            </button>
          </div>
        </div>

        <div class="button-group">
          <button class="advanced-btn" id="advancedBtn">高级设置</button>
          <button class="save-btn" id="saveBtn">保存</button>
        </div>
      </div>

    </div>
  </div>

  <script src="/js/settingsApp.js"></script>
</body>

</html>
