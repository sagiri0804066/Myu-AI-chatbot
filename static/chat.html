    <script>
        document.getElementById('btn-nav-moments').addEventListener('click', function () {
            const url = window.location.href.replace('/chat', '/moments');
            window.open(url, '_blank');
        });
        function openSettings() {
            const url = window.location.href.replace('/chat', '/settings');
            window.open(url, '_blank');
        }

        const btnSettingsDesktop = document.getElementById('btn-nav-settings-desktop');
        const btnSettingsMobile = document.getElementById('btn-nav-settings-mobile');

        if (btnSettingsDesktop) {
            btnSettingsDesktop.addEventListener('click', openSettings);
        }

        if (btnSettingsMobile) {
            btnSettingsMobile.addEventListener('click', openSettings);
        }
    </script>
